<div class="min-h-screen bg-slate-50 text-slate-900">
  <app-header
    [appName]="'MovilCare'"
    (menuRequested)="toggleMenu()"
  />

  <div class="relative flex min-h-[calc(100vh-4rem)]">
    @if (menuOpen()) {
      <button
        type="button"
        aria-label="Cerrar menú"
        class="fixed inset-0 z-40 bg-slate-950/40 md:hidden"
        (click)="closeMenu()"
      ></button>
    }

    <aside
      class="fixed inset-y-16 left-0 z-50 w-72 transform transition-transform duration-200 md:static md:z-auto md:w-64 md:translate-x-0"
      [class.-translate-x-full]="!menuOpen()"
      [class.translate-x-0]="menuOpen()"
    >
    <app-aside
    [appName]="'MovilCare'"
    [items]="menuItems"
    (navigated)="closeMenu()"
    />
    </aside>

    <div class="flex min-w-0 flex-1 flex-col">

      <main class="min-w-0 flex-1 p-4 sm:p-6 md:p-8">
        <div class="mx-auto w-full max-w-7xl">
          <router-outlet />
        </div>
      </main>

      <app-footer />
    </div>
  </div>

  <p-toast />
  <p-confirm-dialog />
</div>
