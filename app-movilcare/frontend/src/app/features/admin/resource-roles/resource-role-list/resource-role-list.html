<div class="space-y-6">
  <app-page-header
    title="Concesiones"
    subtitle="Qué puede hacer cada rol. Esta fila ES el permiso."
  >
    <p-tag
      [value]="rows().length + ' registros'"
      severity="info"
      [rounded]="true"
    />

    <button pButton type="button" (click)="openCreate()">
      <i pButtonIcon class="pi pi-plus"></i>
      <span pButtonLabel>Conceder permiso</span>
    </button>
  </app-page-header>

  @if (error()) {
    <p-message severity="error" styleClass="mb-4 w-full">
      {{ error() }}
    </p-message>
  }

  <p-table
    tableStyleClass="min-w-3xl"
    [value]="visibleRows()"
    [loading]="loading()"
    dataKey="id"
    [paginator]="visibleRows().length > 10"
    [rows]="10"
    [rowHover]="true"
  >
    <ng-template #caption>
      <input
        pInputText
        type="search"
        class="w-full"
        aria-label="Buscar concesiones"
        placeholder="Buscar por rol o recurso..."
        [value]="filter()"
        (input)="filter.set($any($event.target).value)"
      />
    </ng-template>

    <ng-template #header>
      <tr>
        <th>Método</th>
        <th>Ruta</th>
        <th>Rol</th>
        <th>Estado</th>
        <th class="text-right">Acciones</th>
      </tr>
    </ng-template>

    <ng-template #body let-row>
      <tr>
        <td>
          <p-tag
            [value]="resource(row.resource)?.method ?? '—'"
            [severity]="methodSeverity(resource(row.resource)?.method)"
            [rounded]="true"
          />
        </td>
        <td>
          <code class="text-xs text-slate-700">
            {{ resource(row.resource)?.route ?? resourceLabel(row.resource) }}
          </code>
        </td>
        <td class="text-sm font-medium text-slate-700">
          {{ roleLabel(row.role) }}
        </td>
        <td><app-status-tag [status]="row.status" /></td>
        <td class="text-right whitespace-nowrap">
          <button
            pButton
            type="button"
            text
            rounded
            severity="secondary"
            aria-label="Editar concesión"
            pTooltip="Editar"
            (click)="openEdit(row)"
          >
            <i pButtonIcon class="pi pi-pencil"></i>
          </button>

          @if (row.status === 'inactive') {
            <button
              pButton
              type="button"
              text
              rounded
              severity="success"
              aria-label="Reactivar concesión"
              pTooltip="Reactivar"
              (click)="reactivate(row)"
            >
              <i pButtonIcon class="pi pi-replay"></i>
            </button>
          } @else {
            <button
              pButton
              type="button"
              text
              rounded
              severity="danger"
              aria-label="Retirar concesión"
              pTooltip="Retirar"
              (click)="remove(row)"
            >
              <i pButtonIcon class="pi pi-trash"></i>
            </button>
          }
        </td>
      </tr>
    </ng-template>

    <ng-template #emptymessage>
      <tr>
        <td colspan="5">
          <app-empty-state
            icon="pi pi-key"
            title="Sin concesiones"
            message="Concede el primer permiso con «Conceder permiso»."
          />
        </td>
      </tr>
    </ng-template>
  </p-table>

  <p-dialog
    [visible]="dialogVisible()"
    (visibleChange)="dialogVisible.set($event)"
    [header]="editing() ? 'Editar concesión' : 'Nueva concesión'"
    [modal]="true"
    [draggable]="false"
    [resizable]="false"
    styleClass="w-full max-w-2xl mx-4"
  >
    <form
      [formGroup]="form"
      (ngSubmit)="submit()"
      class="grid gap-4 md:grid-cols-2"
    >
      <div class="flex flex-col gap-2">
        <label for="gr-role">Rol</label>
        <p-select
          inputId="gr-role"
          formControlName="role"
          [options]="roles()"
          optionLabel="name"
          optionValue="id"
          [filter]="true"
          [fluid]="true"
        />
      </div>

      <div class="flex flex-col gap-2">
        <label for="gr-resource">Recurso</label>
        <p-select
          inputId="gr-resource"
          formControlName="resource"
          [options]="resourceOptions()"
          optionLabel="label"
          optionValue="id"
          [filter]="true"
          [fluid]="true"
        />
      </div>

      @if (form.touched && form.invalid) {
        <p-message severity="error" styleClass="md:col-span-2">
          Elige rol y recurso.
        </p-message>
      }

      <div class="flex items-end justify-end gap-2 md:col-span-2">
        <button
          pButton
          type="button"
          severity="secondary"
          outlined
          (click)="dialogVisible.set(false)"
        >
          <span pButtonLabel>Cancelar</span>
        </button>
        <button pButton type="submit" [loading]="saving()">
          <span pButtonLabel>Guardar</span>
        </button>
      </div>
    </form>
  </p-dialog>
</div>
