<div class="space-y-6">
  <app-page-header
    title="Asignaciones"
    subtitle="A quién se le da un rol. El par usuario + rol es único."
  >
    <p-tag
      [value]="rows().length + ' registros'"
      severity="info"
      [rounded]="true"
    />

    <button pButton type="button" (click)="openCreate()">
      <i pButtonIcon class="pi pi-plus"></i>
      <span pButtonLabel>Nueva asignación</span>
    </button>
  </app-page-header>

  @if (error()) {
    <p-message severity="error" styleClass="mb-4 w-full">
      {{ error() }}
    </p-message>
  }

  <p-table
    tableStyleClass="min-w-3xl"
    [value]="visibleRows()"
    [loading]="loading()"
    dataKey="id"
    [paginator]="visibleRows().length > 10"
    [rows]="10"
    [rowHover]="true"
  >
    <ng-template #caption>
      <input
        pInputText
        type="search"
        class="w-full"
        aria-label="Buscar asignaciones"
        placeholder="Buscar por usuario o rol..."
        [value]="filter()"
        (input)="filter.set($any($event.target).value)"
      />
    </ng-template>

    <ng-template #header>
      <tr>
        <th>Usuario</th>
        <th>Rol</th>
        <th>Estado</th>
        <th class="text-right">Acciones</th>
      </tr>
    </ng-template>

    <ng-template #body let-row>
      <tr>
        <td class="text-sm font-medium text-slate-700">
          {{ userLabel(row.user) }}
        </td>
        <td class="text-sm text-slate-600">{{ roleLabel(row.role) }}</td>
        <td><app-status-tag [status]="row.status" /></td>
        <td class="text-right whitespace-nowrap">
          <button
            pButton
            type="button"
            text
            rounded
            severity="secondary"
            aria-label="Editar asignación"
            pTooltip="Editar"
            (click)="openEdit(row)"
          >
            <i pButtonIcon class="pi pi-pencil"></i>
          </button>

          @if (row.status === 'inactive') {
            <button
              pButton
              type="button"
              text
              rounded
              severity="success"
              aria-label="Reactivar asignación"
              pTooltip="Reactivar"
              (click)="reactivate(row)"
            >
              <i pButtonIcon class="pi pi-replay"></i>
            </button>
          } @else {
            <button
              pButton
              type="button"
              text
              rounded
              severity="danger"
              aria-label="Retirar asignación"
              pTooltip="Retirar"
              (click)="remove(row)"
            >
              <i pButtonIcon class="pi pi-trash"></i>
            </button>
          }
        </td>
      </tr>
    </ng-template>

    <ng-template #emptymessage>
      <tr>
        <td colspan="4">
          <app-empty-state
            icon="pi pi-link"
            title="Sin asignaciones"
            message="Asigna un rol a un usuario con «Nueva asignación»."
          />
        </td>
      </tr>
    </ng-template>
  </p-table>

  <p-dialog
    [visible]="dialogVisible()"
    (visibleChange)="dialogVisible.set($event)"
    [header]="editing() ? 'Editar asignación' : 'Nueva asignación'"
    [modal]="true"
    [draggable]="false"
    [resizable]="false"
    styleClass="w-full max-w-2xl mx-4"
  >
    <form
      [formGroup]="form"
      (ngSubmit)="submit()"
      class="grid gap-4 md:grid-cols-2"
    >
      <div class="flex flex-col gap-2">
        <label for="ru-user">Usuario</label>
        <p-select
          inputId="ru-user"
          formControlName="user"
          [options]="users()"
          optionLabel="username"
          optionValue="id"
          [filter]="true"
          [fluid]="true"
        />
      </div>

      <div class="flex flex-col gap-2">
        <label for="ru-role">Rol</label>
        <p-select
          inputId="ru-role"
          formControlName="role"
          [options]="roles()"
          optionLabel="name"
          optionValue="id"
          [filter]="true"
          [fluid]="true"
        />
      </div>

      @if (form.touched && form.invalid) {
        <p-message severity="error" styleClass="md:col-span-2">
          Elige usuario y rol.
        </p-message>
      }

      <div class="flex items-end justify-end gap-2 md:col-span-2">
        <button
          pButton
          type="button"
          severity="secondary"
          outlined
          (click)="dialogVisible.set(false)"
        >
          <span pButtonLabel>Cancelar</span>
        </button>
        <button pButton type="submit" [loading]="saving()">
          <span pButtonLabel>Guardar</span>
        </button>
      </div>
    </form>
  </p-dialog>
</div>
