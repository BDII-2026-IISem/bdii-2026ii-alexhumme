<div class="flex min-h-[calc(100vh-4rem)] items-center justify-center p-4">
    <p-card header="Iniciar sesión" class="w-full max-w-md">
        <form [formGroup]="form" (ngSubmit)="submit()" class="flex flex-col gap-4">
            <div class="flex flex-col gap-2">
                <label for="identifier" class="text-sm font-medium">
                    Usuario o correo
                </label>
                <input pInputText id="identifier" formControlName="identifier" autocomplete="username"
                    placeholder="admin o admin@movilcare.test" />
            </div>

            <div class="flex flex-col gap-2">
                <label for="password" class="text-sm font-medium">
                    Contraseña
                </label>
                <p-password id="password" formControlName="password" [toggleMask]="true" [fluid]="true"
                    [feedback]="false" autocomplete="current-password" />
            </div>

            @if (error()) {
            <p-message severity="error" styleClass="w-full">
                {{ error() }}</p-message>
            }

            <button pButton type="submit" [loading]="loading()" class="w-full">
                <span pButtonLabel>Entrar</span>
            </button>
        </form>
    </p-card>
</div>
