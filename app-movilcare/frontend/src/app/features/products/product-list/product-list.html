<div class="space-y-6">
    <app-page-header title="Productos" subtitle="Consulta y administra los productos del catálogo.">
        <p-tag [value]="rows().length + ' registros'" severity="info" [rounded]="true" />

        <button pButton type="button" (click)="openCreate()">
            <i pButtonIcon class="pi pi-plus"></i>
            <span pButtonLabel>Nuevo producto</span>
        </button>
    </app-page-header>

    @if (error()) {
    <p-message severity="error" styleClass="mb-4 w-full">
        {{ error() }}
    </p-message>
    }

    <p-table [value]="visibleRows()" [loading]="loading()" dataKey="id" [paginator]="visibleRows().length > 10"
        [rows]="10" [rowHover]="true">
        <ng-template #caption>
            <div class="flex flex-col gap-3 sm:flex-row sm:items-center">
                <input pInputText type="search" class="w-full sm:flex-1" aria-label="Buscar productos"
                    placeholder="Buscar por SKU, nombre o descripción..." [value]="filter()"
                    (input)="filter.set($any($event.target).value)" />

                <div class="flex items-center gap-2">
                    <p-toggleswitch inputId="available-only" [ngModel]="availableOnly()"
                        (ngModelChange)="toggleAvailableOnly($event)" [ngModelOptions]="{ standalone: true }" />
                    <label for="available-only" class="text-sm">
                        Solo disponibles
                    </label>
                </div>
            </div>
        </ng-template>

        <ng-template #header>
            <tr>
                <th>SKU</th>
                <th>Nombre</th>
                <th>Precio</th>
                <th>Unidades activas</th>
                <th>Estado</th>
                <th class="text-right">Acciones</th>
            </tr>
        </ng-template>

        <ng-template #body let-product>
            <tr>
                <td>{{ product.sku }}</td>
                <td>{{ product.name }}</td>
                <td>{{ product.price }}</td>

                <td>
                    @if (withoutUnits().has(product.id)) {
                    <p-tag value="Sin unidades activas" severity="danger" />
                    } @else {
                    {{ unitCounts().get(product.id) ?? 0 }}
                    }
                </td>

                <td>
                    <app-status-tag [status]="product.status" />
                </td>

                <td class="text-right">
                    <button pButton type="button" text rounded severity="secondary" aria-label="Editar producto"
                        pTooltip="Editar" (click)="openEdit(product)">
                        <i pButtonIcon class="pi pi-pencil"></i>
                    </button>

                    <button pButton type="button" text rounded severity="danger" aria-label="Dar de baja al producto"
                        pTooltip="Dar de baja" [disabled]="product.status === 'inactive'" (click)="remove(product)">
                        <i pButtonIcon class="pi pi-trash"></i>
                    </button>
                </td>
            </tr>
        </ng-template>

        <ng-template #emptymessage>
            <tr>
                <td colspan="6">
                    @if (filter() || availableOnly()) {
                    <app-empty-state icon="pi pi-search" title="Sin coincidencias"
                        message="Ningún producto coincide. Borra el filtro o desactiva «Solo disponibles»." />
                    } @else {
                    <app-empty-state icon="pi pi-box" title="Sin productos registrados"
                        message="Registra el primer producto con el botón «Nuevo producto»." />
                    }
                </td>
            </tr>
        </ng-template>
    </p-table>

    <p-dialog [visible]="dialogVisible()" (visibleChange)="dialogVisible.set($event)"
        [header]="editing() ? 'Editar producto' : 'Nuevo producto'" [modal]="true" [draggable]="false"
        [resizable]="false" styleClass="w-full max-w-2xl mx-4">
        <app-product-form [product]="editing()" [saving]="saving()" [resetKey]="resetKey()" (saved)="save($event)"
            (cancelled)="dialogVisible.set(false)" />
    </p-dialog>
</div>
