<div class="space-y-6">
    <app-page-header title="Unidades serializadas"
        subtitle="Consulta y administra las unidades serializadas registradas.">
        <p-tag [value]="rows().length + ' registros'" severity="info" [rounded]="true" />

        <button pButton type="button" (click)="openCreate()">
            <i pButtonIcon class="pi pi-plus"></i>
            <span pButtonLabel>Nueva unidad</span>
        </button>
    </app-page-header>

    @if (error()) {
    <p-message severity="error" styleClass="mb-4 w-full">
        {{ error() }}
    </p-message>
    }

    <p-table [value]="visibleRows()" [loading]="loading()" dataKey="id" [paginator]="visibleRows().length > 10"
        [rows]="10" [rowHover]="true">
        <ng-template #caption>
            <input pInputText type="search" class="w-full" aria-label="Buscar unidades"
                placeholder="Buscar por nombre, producto o descripción..." [value]="filter()"
                (input)="filter.set($any($event.target).value)" />
        </ng-template>

        <ng-template #header>
            <tr>
                <th>Nombre</th>
                <th>Producto</th>
                <th>Descripción</th>
                <th>Estado</th>
                <th class="text-right">Acciones</th>
            </tr>
        </ng-template>

        <ng-template #body let-unit>
            <tr>
                <td>{{ unit.name }}</td>
                <td>{{ unit.productName }}</td>
                <td>{{ unit.description || '—' }}</td>

                <td>
                    <app-status-tag [status]="unit.status" />
                </td>

                <td class="text-right">
                    <button pButton type="button" text rounded severity="secondary" aria-label="Editar unidad"
                        pTooltip="Editar" (click)="openEdit(unit)">
                        <i pButtonIcon class="pi pi-pencil"></i>
                    </button>

                    <button pButton type="button" text rounded severity="danger" aria-label="Dar de baja a la unidad"
                        pTooltip="Dar de baja" [disabled]="unit.status === 'inactive'" (click)="remove(unit)">
                        <i pButtonIcon class="pi pi-trash"></i>
                    </button>
                </td>
            </tr>
        </ng-template>

        <ng-template #emptymessage>
            <tr>
                <td colspan="5">
                    @if (filter()) {
                    <app-empty-state icon="pi pi-search" title="Sin coincidencias"
                        message="Ninguna unidad coincide. Borra el filtro para ver todas." />
                    } @else {
                    <app-empty-state icon="pi pi-barcode" title="Sin unidades registradas"
                        message="Registra la primera unidad con el botón «Nueva unidad»." />
                    }
                </td>
            </tr>
        </ng-template>
    </p-table>

    <p-dialog [visible]="dialogVisible()" (visibleChange)="dialogVisible.set($event)"
        [header]="editing() ? 'Editar unidad' : 'Nueva unidad'" [modal]="true" [draggable]="false" [resizable]="false"
        styleClass="w-full max-w-2xl mx-4">
        <app-serialized-unit-form [unit]="editing()" [saving]="saving()" [resetKey]="resetKey()" (saved)="save($event)"
            (cancelled)="dialogVisible.set(false)" />
    </p-dialog>
</div>
