<div class="space-y-6">
  <app-page-header
    title="Clientes"
    subtitle="Consulta y administra los clientes registrados."
  >
    <p-tag
      [value]="rows().length + ' registros'"
      severity="info"
      [rounded]="true"
    />

    <button
      pButton
      type="button"
      (click)="openCreate()"
    >
      <i pButtonIcon class="pi pi-plus"></i>
      <span pButtonLabel>Nuevo cliente</span>
    </button>
  </app-page-header>

  @if (error()) {
    <p-message
      severity="error"
      styleClass="mb-4 w-full"
    >
      {{ error() }}
    </p-message>
  }

  <p-table
    [value]="visibleRows()"
    [loading]="loading()"
    dataKey="id"
    [paginator]="visibleRows().length > 10"
    [rows]="10"
    [rowHover]="true"
  >
    <ng-template #caption>
      <input
        pInputText
        type="search"
        class="w-full"
        aria-label="Buscar clientes"
        placeholder="Buscar por nombre, correo o número de documento..."
        [value]="filter()"
        (input)="filter.set($any($event.target).value)"
      />
    </ng-template>

    <ng-template #header>
      <tr>
        <th>Nombre</th>
        <th>Documento</th>
        <th>Correo electrónico</th>
        <th>Teléfono</th>
        <th>Estado</th>
        <th class="text-right">Acciones</th>
      </tr>
    </ng-template>

    <ng-template #body let-customer>
      <tr>
        <td>{{ customer.name }}</td>
        <td>
          {{ customer.documentType }} {{ customer.documentNumber }}
        </td>
        <td>{{ customer.email || '—' }}</td>
        <td>{{ customer.phone || '—' }}</td>

        <td>
          <app-status-tag [status]="customer.status" />
        </td>

        <td class="text-right">
          <button
            pButton
            type="button"
            text
            rounded
            severity="secondary"
            aria-label="Editar cliente"
            pTooltip="Editar"
            (click)="openEdit(customer)"
          >
            <i pButtonIcon class="pi pi-pencil"></i>
          </button>

          <button
            pButton
            type="button"
            text
            rounded
            severity="danger"
            aria-label="Dar de baja al cliente"
            pTooltip="Dar de baja"
            [disabled]="customer.status === 'inactive'"
            (click)="remove(customer)"
          >
            <i pButtonIcon class="pi pi-trash"></i>
          </button>
        </td>
      </tr>
    </ng-template>

    <ng-template #emptymessage>
      <tr>
        <td colspan="6">
          @if (filter()) {
            <app-empty-state
              icon="pi pi-search"
              title="Sin coincidencias"
              message="Ningún cliente coincide. Borra el filtro para ver todos."
            />
          } @else {
            <app-empty-state
              icon="pi pi-users"
              title="Sin clientes registrados"
              message="Registra el primer cliente con el botón «Nuevo cliente»."
            />
          }
        </td>
      </tr>
    </ng-template>
  </p-table>

  <p-dialog
    [visible]="dialogVisible()"
    (visibleChange)="dialogVisible.set($event)"
    [header]="editing() ? 'Editar cliente' : 'Nuevo cliente'"
    [modal]="true"
    [draggable]="false"
    [resizable]="false"
    styleClass="w-full max-w-2xl mx-4"
  >
    <app-customer-form
      [customer]="editing()"
      [saving]="saving()"
      [resetKey]="resetKey()"
      (saved)="save($event)"
      (cancelled)="dialogVisible.set(false)"
    />
  </p-dialog>
</div>
